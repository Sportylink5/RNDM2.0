<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c101a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RNDM">
  <meta name="description" content="RNDM Chat — личные сообщения, группы и каналы. Общение в твоём ритме.">
  <title>RNDM Chat</title>
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=44.0.0">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('rndm-theme') === 'light' ? 'light' : 'dark'; } catch {}
  </script>
</head>
<body>
  <div id="root"><div class="boot"><span class="brand-mark">R</span><b>RNDM Chat</b><span class="spinner"></span><p>Подключаемся…</p></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" class="modal" aria-labelledby="modalTitle"></dialog>
  <div id="popover" class="popover" hidden></div>
  <noscript><p>Включи JavaScript в браузере, чтобы открыть RNDM Chat.</p></noscript>
  <script src="supabase-2.117.2.js?v=44.0.0"></script>
  <script src="config.js?v=44.0.0"></script>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('root').innerHTML = '<div class="boot"><span class="brand-mark">R</span><h2>Открой опубликованный RNDM</h2><p>Загрузи файлы на GitHub Pages и открой опубликованную HTTPS-ссылку.</p><p>Инструкция находится в GITHUB_PAGES_RU.txt.</p></div>';
    }
  </script>
  <script type="module" src="app.js?v=44.0.0"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=44.0.0',{scope:'./',updateViaCache:'none'}).then(reg=>reg.update().catch(console.warn)).catch(console.warn));
    }
  </script>
</body>
</html>
